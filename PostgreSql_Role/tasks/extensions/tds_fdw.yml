    - "tds_fdw_{{ postgresql_version }}-llvmjit.x86_64"
    state: present
  when: ansible_pkg_mgr == "dnf" and ansible_distribution == "Fedora"
  notify:
    - restart postgresql

- name: PostgreSQL | Extensions | Make sure the postgres pg_cron extensions are installed | Rocky
  dnf:
    name: 
    - "freetds"
    - "freetds-devel"
    - "tds_fdw_{{ postgresql_version }}-llvmjit.x86_64"
    state: present
  when: ansible_pkg_mgr == "dnf" and ansible_distribution == "Rocky"
  notify:
    - restart postgresql
