name: flutter_joystick_app
description: Flutter app для управления джойстиком через Bluetooth HC-05

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Bluetooth для подключения к HC-05
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.0.1
  # Для визуализации джойстика
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

